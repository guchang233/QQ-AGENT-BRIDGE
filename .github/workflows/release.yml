name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  pack:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS 托管机器经常排不上队；它只是额外的免安装包（没有时更新程序会用通用包），不能挡住发布
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 标签与版本号一致
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" || (echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本不一致" && exit 1)
      - name: 打包（带依赖的免安装包按平台各打一份）
        shell: bash
        run: node scripts/pack-release.mjs --with-deps $([ "$RUNNER_OS" = Windows ] || echo --no-generic)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/*.zip

  publish:
    needs: pack
    # 某个平台失败也继续发布，但 Windows 包和通用包必须在（下面检查）
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 从 CHANGELOG 提取本版本说明
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "见 CHANGELOG.md" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 必需的安装包都在
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls -l dist
          test -f "dist/qq-agent-bridge-v$v.zip" && test -f "dist/qq-agent-bridge-v$v-win-x64.zip"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
